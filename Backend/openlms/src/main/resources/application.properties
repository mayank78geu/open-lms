spring.application.name=openlms

# --- Active Profile -----------------------------------------------------------
# Defaults to 'local' (H2 file DB) so no MySQL is needed to run locally.
# Set SPRING_PROFILES_ACTIVE=prod (or remove this line) for production MySQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Database (used when no profile override is active) -----------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/open_lms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server -------------------------------------------------------------------
server.port=${PORT:8081}

# --- JWT ----------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRqd3RrZXlmb3JvcGVubG1zZGV2ZWxvcG1lbnQyMDI2}
app.jwt.expiration-ms=86400000

# --- Cloudinary ---------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dholhsgd}
cloudinary.api-key=${CLOUDINARY_API_KEY:513667225463921}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:B-91EynEDK3jpsjkIGVbLY-duzk}

# --- File Upload --------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Google OAuth -------------------------------------------------------------
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
